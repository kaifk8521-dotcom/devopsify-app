apiVersion: apps/v1
kind: Deployment
metadata:
  name: devopsify-app
  namespace: devopsify
  labels:
    app: devopsify-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devopsify-app
  template:
    metadata:
      labels:
        app: devopsify-app
    spec:
      containers:
        - name: devopsify-app
          # CI updates this line automatically on every push to main
          image: ghcr.io/kaifk8521-dotcom/devopsify-app:bea202d
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: APP_VERSION
              value: "bea202d"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
