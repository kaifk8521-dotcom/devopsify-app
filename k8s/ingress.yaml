apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devopsify-app
  namespace: devopsify
spec:
  ingressClassName: nginx
  rules:
    - host: devopsify.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devopsify-app
                port:
                  number: 80
