apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devopsify-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kaifk8521-dotcom/devopsify-app.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: devopsify
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
